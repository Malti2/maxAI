services:
  postgres:
    image: postgres:16-alpine
    container_name: max-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maxai}
      POSTGRES_USER: ${POSTGRES_USER:-maxai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maxai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - max-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: max-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-maxai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-maxai}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # AI provider (any Chat-Completions-compatible endpoint)
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL_LITE: ${AI_MODEL_LITE:-gpt-4o-mini}
      AI_MODEL_PRO: ${AI_MODEL_PRO:-gpt-4o}
      AI_MODEL_BEAST: ${AI_MODEL_BEAST:-gpt-4o}
      # Optional per-tier overrides (fall back to the globals above)
      AI_BASE_URL_LITE: ${AI_BASE_URL_LITE:-}
      AI_API_KEY_LITE: ${AI_API_KEY_LITE:-}
      AI_BASE_URL_PRO: ${AI_BASE_URL_PRO:-}
      AI_API_KEY_PRO: ${AI_API_KEY_PRO:-}
      AI_BASE_URL_BEAST: ${AI_BASE_URL_BEAST:-}
      AI_API_KEY_BEAST: ${AI_API_KEY_BEAST:-}
      # Keyless web search (DuckDuckGo + Wikipedia, pages read through a reader)
      WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-true}
      WEB_SEARCH_READER_URL: ${WEB_SEARCH_READER_URL:-https://r.jina.ai/}
      WEB_SEARCH_WIKI_LANGS: ${WEB_SEARCH_WIKI_LANGS:-de,en}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - max-network

  # Serves the built frontend and reverse-proxies the API to the backend, so the
  # whole app is reachable on a single port from one origin.
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: max-web
    restart: unless-stopped
    depends_on:
      # Wait for a healthy backend so the first page load can't hit a 502.
      backend:
        condition: service_healthy
    ports:
      - "${PORT:-80}:80"
    networks:
      - max-network

volumes:
  postgres_data:

networks:
  max-network:
    driver: bridge
